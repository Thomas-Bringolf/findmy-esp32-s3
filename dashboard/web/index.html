<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find My Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <h1>Find My Dashboard</h1>

    <!-- Device selector -->
    <div class="field">
      <label for="device">Device</label>
      <select id="device"><option value="">Loading…</option></select>
    </div>

    <!-- Fade radio buttons -->
    <div class="field">
      <label>Fade dots older than</label>
      <div class="radio-group">
        <label><input type="radio" name="fade" value="1h" checked> 1h</label>
        <label><input type="radio" name="fade" value="24h"> 24h</label>
        <label><input type="radio" name="fade" value="168h"> 7d</label>
        <label><input type="radio" name="fade" value="720h"> 1M</label>
        <label><input type="radio" name="fade" value="8760h"> 1y</label>
        <label><input type="radio" name="fade" value="custom" id="fadeCustom"> Custom <input type="text" id="fadeCustomInput" style="display:none;width:80px;" /></label>
      </div>
    </div>

    <!-- Auto refresh -->
    <div class="field row">
      <label class="checkbox"><input type="checkbox" id="autorefresh" checked> Auto-refresh (30s)</label>
      <button id="refresh" class="ghost">Refresh</button>
    </div>

    <!-- Device status history -->
    <div class="field">
      <h3>Device state</h3>
      <div id="history" style="max-height:150px;overflow:auto;font-size:12px;"></div>
    </div>

    <!-- Device status ledger -->
    <div class="ledger">
      <h3>Device status</h3>
      <table id="ledgerTable">
        <thead><tr><th>Device</th><th>Last seen</th><th>Status</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
      </table>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
